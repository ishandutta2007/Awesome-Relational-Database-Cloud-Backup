<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Linear Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0a192f" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Cylinder / Cloud Glow Gradients -->
    <linearGradient id="dbGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.2"/>
    </linearGradient>

    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.1"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .bg { fill: url(#bgGrad); }
    .grid-line { stroke: #1e293b; stroke-width: 1; stroke-opacity: 0.6; }
    
    /* Animations */
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.4; }
      50% { transform: scale(1.15) translate(10px, -15px); opacity: 0.7; }
    }
    @keyframes dataStream {
      0% { stroke-dashoffset: 100; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes floatCard1 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes floatCard2 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(8px); }
    }
    @keyframes radarSweep {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .orb-1 { animation: pulseOrb 8s ease-in-out infinite; transform-origin: 200px 100px; }
    .orb-2 { animation: pulseOrb 10s ease-in-out infinite reverse; transform-origin: 1000px 300px; }
    
    .data-flow {
      stroke-dasharray: 8, 8;
      animation: dataStream 3s linear infinite;
    }
    
    .pill-float-1 { animation: floatCard1 4s ease-in-out infinite; }
    .pill-float-2 { animation: floatCard2 5s ease-in-out infinite; }
    
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      fill: #94a3b8;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #e2e8f0;
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="420" class="bg" rx="16" />

  <!-- Background Animated Ambient Light Orbs -->
  <circle cx="200" cy="120" r="140" fill="#0284c7" opacity="0.25" filter="url(#glow)" class="orb-1" />
  <circle cx="1020" cy="280" r="160" fill="#7c3aed" opacity="0.22" filter="url(#glow)" class="orb-2" />
  <circle cx="600" cy="210" r="180" fill="#0ea5e9" opacity="0.12" filter="url(#glow)" />

  <!-- Cybernetic Grid Pattern -->
  <g class="grid-layer">
    <line x1="0" y1="70" x2="1200" y2="70" class="grid-line" />
    <line x1="0" y1="140" x2="1200" y2="140" class="grid-line" />
    <line x1="0" y1="210" x2="1200" y2="210" class="grid-line" />
    <line x1="0" y1="280" x2="1200" y2="280" class="grid-line" />
    <line x1="0" y1="350" x2="1200" y2="350" class="grid-line" />

    <line x1="150" y1="0" x2="150" y2="420" class="grid-line" />
    <line x1="300" y1="0" x2="300" y2="420" class="grid-line" />
    <line x1="450" y1="0" x2="450" y2="420" class="grid-line" />
    <line x1="600" y1="0" x2="600" y2="420" class="grid-line" />
    <line x1="750" y1="0" x2="750" y2="420" class="grid-line" />
    <line x1="900" y1="0" x2="900" y2="420" class="grid-line" />
    <line x1="1050" y1="0" x2="1050" y2="420" class="grid-line" />
  </g>

  <!-- Dynamic Data Stream Circuit Lines (Background) -->
  <path d="M 80 340 Q 250 280 400 340 T 750 310 T 1120 360" fill="none" stroke="url(#accentGrad)" stroke-width="2.5" class="data-flow" />
  <path d="M 120 90 Q 380 150 620 90 T 1080 110" fill="none" stroke="#38bdf8" stroke-width="1.8" opacity="0.6" class="data-flow" style="animation-duration: 4.5s;" />

  <!-- Floating Database & Cloud Technology Badges / Pills -->
  <g class="pill-float-1" transform="translate(100, 50)">
    <rect width="130" height="34" rx="17" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" opacity="0.85"/>
    <circle cx="20" cy="17" r="6" fill="#38bdf8" />
    <text x="36" y="22" class="badge-text">PostgreSQL</text>
  </g>

  <g class="pill-float-2" transform="translate(970, 50)">
    <rect width="130" height="34" rx="17" fill="#1e293b" stroke="#818cf8" stroke-width="1.2" opacity="0.85"/>
    <circle cx="20" cy="17" r="6" fill="#818cf8" />
    <text x="36" y="22" class="badge-text">MySQL / SQL</text>
  </g>

  <g class="pill-float-2" transform="translate(70, 345)">
    <rect width="150" height="34" rx="17" fill="#1e293b" stroke="#c084fc" stroke-width="1.2" opacity="0.85"/>
    <circle cx="20" cy="17" r="6" fill="#c084fc" />
    <text x="36" y="22" class="badge-text">Oracle &amp; SAP</text>
  </g>

  <g class="pill-float-1" transform="translate(970, 345)">
    <rect width="150" height="34" rx="17" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" opacity="0.85"/>
    <circle cx="20" cy="17" r="6" fill="#38bdf8" />
    <text x="36" y="22" class="badge-text">S3 &amp; Cloud Vault</text>
  </g>

  <!-- Center Decorative Shield & Database Icon (Foreground) -->
  <g transform="translate(600, 115)">
    <!-- Central Cloud / DB Icon Graphic -->
    <path d="M -45 -10 C -45 -30 -20 -40 0 -40 C 20 -40 45 -30 45 -10 C 55 -10 65 0 65 15 C 65 30 50 40 35 40 L -35 40 C -52 40 -65 28 -65 12 C -65 -2 -55 -10 -45 -10 Z" fill="#0f172a" stroke="url(#accentGrad)" stroke-width="2.5" filter="url(#glow)"/>
    <!-- Database Stack inside -->
    <ellipse cx="0" cy="-2" rx="22" ry="7" fill="none" stroke="#38bdf8" stroke-width="2"/>
    <path d="M -22 -2 v 14 c 0 3.8 9.8 7 22 7 s 22 -3.2 22 -7 v -14" fill="none" stroke="#38bdf8" stroke-width="2"/>
    <path d="M -22 12 v 14 c 0 3.8 9.8 7 22 7 s 22 -3.2 22 -7 v -14" fill="none" stroke="#818cf8" stroke-width="2"/>
  </g>

  <!-- Foreground Title and Subtitles (Completely Legible and Dominant) -->
  <g transform="translate(600, 215)" text-anchor="middle">
    <text y="0" class="title-text" font-size="40" filter="drop-shadow(0 4px 12px rgba(0,0,0,0.8))">
      Awesome Relational Database Cloud Backup
    </text>
    <text y="36" class="subtitle-text" font-size="18" font-weight="500" fill="#38bdf8">
      Enterprise SaaS Data Protection &amp; Open-Source RDBMS Backup Solutions
    </text>
    <text y="68" class="subtitle-text" font-size="14" fill="#94a3b8">
      PostgreSQL • MySQL • MariaDB • Oracle • MS SQL Server • S3 / GCS / Azure Cloud Storage
    </text>
  </g>

  <!-- Outer Border Frame -->
  <rect x="2" y="2" width="1196" height="416" rx="15" fill="none" stroke="#334155" stroke-width="1.5" opacity="0.8"/>
</svg>
